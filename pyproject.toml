[project]
name = "requipso"
version = "0.2.5"
description = "Requêteur de données de santé ipso santé"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.41.2",
    "boto3-stubs>=1.41.5",
    "edsnlp[ml]>=0.23",
    "google-api-core>=2.30.3",
    "google-api-python-client>=2.194.0",
    "google-auth>=2.49.2",
    "google-auth-oauthlib>=1.2",
    "graphviz>=0.21",
    "gspread<6",
    "gspread-formatting>=1.2.1",
    "gspread-pandas>=3.2.3",
    "ipykernel>=6.30.1",
    "jupyterlab>=4.4.9",
    "kaleido>=1.1.0",
    "marimo[lsp,mcp,recommended]>=0.17.0",
    "matplotlib>=3.10.6",
    "mypy>=1.18.2",
    "networkx>=3.5",
    "openpyxl>=3.1.5",
    "pandas>=2.3.2",
    "pandas-stubs>=2.3.2.250926",
    "polars>=1.33.1",
    "polars-permutation>=0.1.0",
    "pyarrow>=21.0.0",
    "ruff>=0.14.1",
    "schemdraw>=0.21",
    "sqlglot>=28.0.0",
    "styleframe>=4.2",
    "tabulate>=0.9.0",
    "types-networkx>=3.6.0.20251127",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
requipso = "requipso.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
[tool.setuptools.packages.find]
include = ["requipso*"]

[tool.setuptools.package-data]
requipso = ["google_oauth_client.json", "docs/mkdocs.yml", "docs/pages/**/*"]

[tool.uv]
default-groups = ["docs"]

[tool.marimo.runtime]
on_cell_change = "autorun"

[tool.mypy]
# --- Core ---
ignore_missing_imports = false
follow_imports = "normal"
namespace_packages = true
explicit_package_bases = true

# --- Warning settings ---
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
warn_unreachable = true

# --- Optional strictness ---
strict_equality = true
disallow_subclassing_any = true

# --- Level of strictness (balanced, not extreme) ---
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = false       # Set to true if you want strict mode
disallow_untyped_calls = false      # Set to true if stricter type checking is desired
disallow_untyped_decorators = false

# --- Error formatting ---
show_error_codes = true
pretty = true

[dependency-groups]
docs = [
    "mike>=2.1",
    "mkdocs-macros-plugin~=1.5.0",
    "mkdocs-material~=9.7.7",
]

# --- Plugins (enable if needed) ---
# plugins = [
#   "pydantic.mypy"
# ]

