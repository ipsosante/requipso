# Construit le paquet à chaque pull request et push sur main.
# Le publie sur PyPI uniquement pour un tag vX.Y.Z, via Trusted Publishing (pas de jeton).
# À activer une fois :
#   - GitHub : Settings → Environments → environnement « pypi »
#   - PyPI : Trusted Publisher, workflow « publish.yml », environnement « pypi »

name: Build and publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Vérifier que le tag correspond à la version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Le tag '$GITHUB_REF_NAME' ne correspond pas à la version '$version' de pyproject.toml." >&2
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/requipso
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
